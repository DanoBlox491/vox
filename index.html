<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vox</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b0d14;--p1:#12151f;--p2:#191d2b;--p3:#232839;--blue:#00b2ff;--pink:#ff2e93;--txt:#e8ecf5;--mut:#8a93ad}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;color:#fff;background:var(--p3)}
button:hover{filter:brightness(1.2)}
button.pri{background:var(--blue);color:#001a2b;box-shadow:0 0 18px #00b2ff66}
button.pink{background:var(--pink);box-shadow:0 0 18px #ff2e9355}
button.danger{background:#d6334a}
input,textarea{font-family:inherit;width:100%;padding:11px 13px;border-radius:10px;border:2px solid var(--p3);background:var(--p1);color:var(--txt);outline:0;margin-bottom:10px}
input:focus,textarea:focus{border-color:var(--blue)}
.hidden{display:none!important}
/* landing */
#landing{display:grid;grid-template-columns:1fr 1fr;height:100vh}
.side{display:flex;flex-direction:column;justify-content:center;padding:6vw;position:relative}
.side.l{background:radial-gradient(circle at 20% 20%,#00b2ff33,transparent 55%),var(--p1)}
.side.r{background:radial-gradient(circle at 80% 80%,#ff2e9333,transparent 55%),var(--bg);border-left:2px solid var(--p3)}
.logo{font-size:56px;font-weight:900;letter-spacing:-2px;color:var(--blue);text-shadow:0 0 28px #00b2ffaa;position:absolute;top:28px;left:6vw}
.side h2{font-size:34px;margin-bottom:6px}
.side p.sub{color:var(--mut);margin-bottom:22px}
.side button{width:100%;margin-bottom:10px}
.err{color:#ff6b81;min-height:20px;font-size:14px}
/* app */
#app{display:grid;grid-template-columns:72px 240px 1fr;height:100vh}
#rail{background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto}
.ico{width:48px;height:48px;border-radius:24px;background:var(--p3);display:grid;place-items:center;font-weight:900;cursor:pointer;transition:.15s;overflow:hidden;flex-shrink:0}
.ico:hover,.ico.on{border-radius:14px;background:var(--blue);color:#001a2b;box-shadow:0 0 14px #00b2ff88}
.ico.grp{background:#2b3a2f}.ico.grp.on{background:#3ddc84;color:#032}
#side2{background:var(--p1);display:flex;flex-direction:column;min-height:0}
#side2 header{padding:14px;font-weight:900;border-bottom:2px solid var(--p2);display:flex;justify-content:space-between;align-items:center;gap:6px}
#list{flex:1;overflow-y:auto;padding:8px}
.item{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:8px;justify-content:space-between}
.item:hover{background:var(--p2);color:var(--txt)}.item.on{background:var(--p3);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--p3);flex-shrink:0}
#me{padding:10px;background:var(--p2);display:flex;align-items:center;gap:8px;cursor:pointer}
#me b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--p2)}
#top{padding:14px 18px;font-weight:900;border-bottom:2px solid var(--p3);display:flex;justify-content:space-between;align-items:center;gap:8px}
#msgs{flex:1;overflow-y:auto;padding:16px 18px}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .n{font-weight:700}.msg .t{color:var(--mut);font-size:12px;margin-left:6px}
.msg img.m,.msg video{max-width:320px;max-height:260px;border-radius:10px;margin-top:6px;display:block}
.msg a{color:var(--blue)}
#composer{padding:14px 18px;display:flex;gap:8px;position:relative;align-items:center}
#composer input{margin:0}
#plus{width:44px;font-size:20px;background:var(--p3)}
#menu{position:absolute;bottom:68px;left:18px;background:var(--p1);border:2px solid var(--p3);border-radius:12px;padding:6px;box-shadow:0 8px 30px #000a;z-index:5}
#menu div{padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
#menu div:hover{background:var(--p3)}
.msg{position:relative}
.msg .body{min-width:0;flex:1;word-break:break-word}
.msg .acts{position:absolute;right:0;top:-8px;display:none;gap:2px;background:var(--p1);border:2px solid var(--p3);border-radius:8px;padding:2px}
.msg:hover .acts{display:flex}
.acts button{padding:3px 8px;font-size:13px;background:transparent}
@media(hover:none){.msg .acts{display:flex;position:static;margin-top:4px;width:max-content}}
.prev{display:block;max-width:380px;margin-top:8px;background:var(--p1);border-left:4px solid var(--blue);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--txt)}
.prev img{width:100%;display:block;max-height:210px;object-fit:cover}
.prev div{padding:8px 10px}.prev b{display:block;margin-bottom:2px}.prev span{color:var(--mut);font-size:13px;display:block}.prev small{color:var(--blue);font-size:12px}
.filecard{display:inline-flex;gap:8px;align-items:center;background:var(--p1);border:2px solid var(--p3);border-radius:10px;padding:8px 12px;margin-top:6px}
.filecard button{padding:4px 10px}.filecard a{color:var(--blue);text-decoration:none;font-weight:700}
.vexp{position:absolute;top:10px;right:10px;background:#000a;padding:4px 9px}
#viewer{position:fixed;inset:0;background:#000e;z-index:50;display:flex;flex-direction:column}
#viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:8px}
#vstage{flex:1;display:flex;overflow:auto;min-height:0}
#vstage img{max-width:96vw;max-height:84vh;object-fit:contain;cursor:zoom-in}
#vstage img.z{max-width:none;max-height:none;cursor:zoom-out}
#vstage video{max-width:96vw;max-height:84vh}
#vstage iframe{width:min(1000px,96vw);height:84vh;border:0;background:#fff;border-radius:8px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;background:#000a;border-radius:50%;width:48px;height:48px;padding:0}
.vnav.l{left:12px}.vnav.r{right:12px}
.empty{color:var(--mut);text-align:center;margin-top:20vh}
.spinner {width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite;}
@keyframes spin { to { transform: rotate(360deg); } }
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}
#modal .box{background:var(--p1);border:2px solid var(--p3);border-radius:16px;padding:22px;width:min(420px,92vw);max-height:90vh;overflow-y:auto}
#modal h3{margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
#callbox{position:fixed;inset:0;background:#000d;z-index:30;display:grid;place-items:center}
#callbox .vids{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#callbox video{width:min(420px,44vw);background:#000;border-radius:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p3);padding:10px 18px;border-radius:10px;z-index:40}
@media(max-width:760px){#landing{grid-template-columns:1fr;overflow-y:auto}#landing .logo{position:static}#app{grid-template-columns:60px 1fr}#side2{display:none}}
</style>
</head>
<body>

<div id="landing">
  <div class="side l">
    <div class="logo">VOX</div>
    <h2>Welcome back 👑</h2><p class="sub">Log in and jump into your servers.</p>
    <input id="lEmail" type="email" placeholder="Email">
    <input id="lPass" type="password" placeholder="Password">
    <button class="pri" onclick="login()">Log in</button>
    <button onclick="google()">Continue with Google</button>
    <div class="err" id="lErr"></div>
  </div>
  <div class="side r">
    <h2>New here? 🚀</h2><p class="sub">Make an account and get your own Vox ID.</p>
    <input id="sName" placeholder="Display name">
    <input id="sEmail" type="email" placeholder="Email">
    <input id="sPass" type="password" placeholder="Password (6+ characters)">
    <button class="pink" onclick="signup()">Create account</button>
    <div class="err" id="sErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="rail"></div>
  <div id="side2">
    <header><span id="sideTitle">Home</span><span id="sideBtns"></span></header>
    <div id="list"></div>
    <div id="me" onclick="openProfile()"><img class="avatar" id="meAv"><b id="meName"></b><span>⚙️</span></div>
  </div>
  <div id="main">
    <div id="top"><span id="topTitle">Pick something on the left</span><span id="topBtns"></span></div>
    <div id="msgs"><div class="empty">No chat open yet. Pick a server, group or friend. 🔥</div></div>
    <div id="composer" class="hidden">
      <button id="plus" onclick="toggleMenu(event)">+</button>
      <div id="menu" class="hidden">
        <div onclick="pick('image/*,video/*')">📷 Photo/Video</div>
        <div onclick="pick('audio/*')">🎵 Music/Audio</div>
        <div onclick="pick('*/*')">📁 Document/File</div>
      </div>
      <input id="text" placeholder="Type a message" onkeydown="if(event.key==='Enter')send()">
      <button class="pri" onclick="send()">Send</button>
      <input type="file" id="file" class="hidden" onchange="upload(this)">
    </div>
  </div>
</div>

<div id="viewer" class="hidden">
  <div class="vbar"><b id="vtitle"></b><span><a id="vdl" target="_blank" rel="noopener"><button>⬇ Download</button></a> <button onclick="closeViewer()">✕ Close</button></span></div>
  <div id="vstage"></div>
  <button class="vnav l" id="vprev" onclick="vnav(-1)">‹</button><button class="vnav r" id="vnext" onclick="vnav(1)">›</button>
</div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="callbox" class="hidden">
  <div><div class="vids"><video id="localV" autoplay muted playsinline></video><video id="remoteV" autoplay playsinline></video></div>
  <p style="text-align:center;margin-top:14px"><button class="danger" onclick="hangup()">End call</button></p></div>
</div>

<script>
/* 🚨 YOUR RENDER BOT URL */
const BOT_API_URL = 'https://vox-bot-04l6.onrender.com/api/bot';

const firebaseConfig = {
  apiKey: "AIzaSyC2cLgHHIYXxKx62JCntppUVYJkfWT9wDw",
  authDomain: "vox-chat-979fd.firebaseapp.com",
  projectId: "vox-chat-979fd",
  storageBucket: "vox-chat-979fd.firebasestorage.app",
  messagingSenderId: "49260313546",
  appId: "1:49260313546:web:63a50e8b0f30c8989bed33",
  measurementId: "G-M7CZN9NER3"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const FIVE_DAYS = 5 * 24 * 60 * 60 * 1000;
const DEFAULT_AV = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='%23232839'/><circle cx='32' cy='24' r='12' fill='%2300b2ff'/><rect x='12' y='40' width='40' height='20' rx='10' fill='%2300b2ff'/></svg>";

let me = null, profile = {}, servers = [], groups = [], view = {type: 'home'}, channels = [], channel = null;
let unsubs = {}, userCache = {}, uploadAccept = '*/*', msgCache = {}, previewCache = {};

function toast(t) { const d = document.createElement('div'); d.id = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stop(k) { if (unsubs[k]) { unsubs[k](); unsubs[k] = null; } }

['click', 'keydown'].forEach(e => document.addEventListener(e, () => { if (me) localStorage.setItem('vox_last_active', Date.now()); }));

async function login() {
  try { await auth.signInWithEmailAndPassword($('lEmail').value.trim(), $('lPass').value); }
  catch (e) { $('lErr').textContent = e.message; }
}
async function signup() {
  try {
    const c = await auth.createUserWithEmailAndPassword($('sEmail').value.trim(), $('sPass').value);
    await db.collection('vox_users').doc(c.user.uid).set({
      displayName: $('sName').value.trim() || 'New Voxer', photoURL: '', bio: '', socials: {yt: '', discord: ''}, friends: []
    });
  } catch (e) { $('sErr').textContent = e.message; }
}
let googleBusy = false;
async function google() {
  if (googleBusy) return;
  googleBusy = true; $('lErr').textContent = '';
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) {
    if (e.code === 'auth/cancelled-popup-request' || e.code === 'auth/popup-closed-by-user') return;
    $('lErr').textContent = e.message;
  }
  finally { googleBusy = false; }
}
function logout() { auth.signOut(); closeModal(); }
function dbErr(e) { console.error(e); toast('Database error: ' + (e.code || e.message) + ' - check your Firestore rules!'); }

auth.onAuthStateChanged(async user => {
  if (!user) { me = null; Object.keys(unsubs).forEach(stop); $('app').classList.add('hidden'); $('landing').classList.remove('hidden'); return; }
  const last = +localStorage.getItem('vox_last_active') || Date.now();
  if (Date.now() - last > FIVE_DAYS) { localStorage.removeItem('vox_last_active'); auth.signOut(); return; }
  localStorage.setItem('vox_last_active', Date.now());
  me = user;
  $('lErr').textContent = ''; $('sErr').textContent = '';
  const ref = db.collection('vox_users').doc(user.uid);
  $('landing').classList.add('hidden'); $('app').classList.remove('hidden');
  $('meName').textContent = user.displayName || 'You'; $('meAv').src = user.photoURL || DEFAULT_AV;
  try {
    const snap = await ref.get();
    if (!snap.exists) await ref.set({displayName: user.displayName || 'New Voxer', photoURL: user.photoURL || '', bio: '', socials: {yt: '', discord: ''}, friends: []});
  } catch (e) { dbErr(e); }
  stop('me');
  unsubs.me = ref.onSnapshot(s => { profile = s.data() || {}; userCache[user.uid] = profile; renderMe(); if (view.type === 'home') renderSide(); }, dbErr);
  stop('servers');
  unsubs.servers = db.collection('vox_servers').onSnapshot(s => {
    servers = s.docs.map(d => ({id: d.id, ...d.data()})); renderRail();
  }, dbErr);
  stop('groups');
  unsubs.groups = db.collection('vox_groups').where('members', 'array-contains', user.uid).onSnapshot(s => {
    groups = s.docs.map(d => ({id: d.id, ...d.data()})); renderRail();
  }, dbErr);
  handleJoin();
  listenCalls();
});

async function handleJoin() {
  const id = new URLSearchParams(location.search).get('join');
  if (!id) return;
  try {
    await db.collection('vox_groups').doc(id).update({members: firebase.firestore.FieldValue.arrayUnion(me.uid)});
    toast('You joined the group! 🎉'); openView('group', id);
  } catch (e) { toast('That invite link did not work.'); }
  history.replaceState({}, '', location.pathname);
}

function renderMe() { $('meName').textContent = profile.displayName || 'You'; $('meAv').src = profile.photoURL || DEFAULT_AV; }

function renderRail() {
  const r = $('rail');
  let h = `<div class="ico ${view.type === 'home' ? 'on' : ''}" title="Home" onclick="openView('home')">🏠</div>`;
  servers.forEach(s => h += `<div class="ico ${view.type === 'server' && view.id === s.id ? 'on' : ''}" title="${esc(s.name)}" onclick="openView('server','${s.id}')">${esc((s.name || '?')[0].toUpperCase())}</div>`);
  groups.forEach(g => h += `<div class="ico grp ${view.type === 'group' && view.id === g.id ? 'on' : ''}" title="${esc(g.name)}" onclick="openView('group','${g.id}')">${esc((g.name || '?')[0].toUpperCase())}</div>`);
  h += `<div class="ico" title="Create server" onclick="createServerModal()">＋</div><div class="ico grp" title="Create group" onclick="createGroupModal()">👥</div>`;
  r.innerHTML = h;
}

async function openView(type, id) {
  view = {type, id}; channel = null; channels = [];
  stop('chan'); stop('msgs');
  $('composer').classList.add('hidden');
  $('msgs').innerHTML = '<div class="empty">No chat open yet. 🔥</div>';
  $('topTitle').textContent = type === 'home' ? 'Friends' : '';
  $('topBtns').innerHTML = '';
  if (type === 'server') {
    unsubs.chan = db.collection('vox_channels').where('serverId', '==', id).onSnapshot(s => {
      channels = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      if (view.type === 'server' && view.id === id && (!channel || !channels.find(c => c.id === channel.id))) {
        const first = channels.find(c => c.type === 'text');
        if (first) { selectChannel(first.id); return; }
      }
      renderSide();
    });
  } else if (type === 'group') {
    const g = groups.find(x => x.id === id);
    $('topTitle').textContent = '👥 ' + (g ? g.name : 'Group');
    $('topBtns').innerHTML = `<button onclick="shareInvite('${id}')">🔗 Invite link</button>` + (g && g.createdBy === me.uid ? ` <button class="danger" onclick="deleteGroup('${id}')">🗑️ Delete</button>` : '');
    $('composer').classList.remove('hidden');
    listenMessages();
  }
  renderRail(); renderSide();
}

function selectChannel(cid) {
  const c = channels.find(x => x.id === cid); if (!c) return;
  if (c.type === 'voice') {
    channel = c; stop('msgs');
    $('topTitle').textContent = '🔊 ' + c.name; $('composer').classList.add('hidden');
    $('msgs').innerHTML = `<div class="empty"><p>You are in the voice channel <b>${esc(c.name)}</b></p><br><button class="pri" onclick="joinVoice()">📹 Join video call</button></div>`;
    renderSide(); return;
  }
  channel = c;
  $('topTitle').textContent = '# ' + c.name;
  $('composer').classList.remove('hidden');
  listenMessages(); renderSide();
}

function renderSide() {
  const l = $('list'), t = $('sideTitle'), b = $('sideBtns');
  if (view.type === 'home') {
    t.textContent = 'Friends'; b.innerHTML = `<button class="pri" onclick="addFriendModal()">＋ Add</button>`;
    const f = profile.friends || [];
    l.innerHTML = f.length ? f.map(u => `<div class="item"><span id="fr_${u}" style="display:flex;gap:8px;align-items:center"><img class="avatar" src="${DEFAULT_AV}"><span>…</span></span><button onclick="startCall('${u}')">📹</button></div>`).join('')
      : '<div class="empty" style="margin-top:30px">No friends yet. Share your Vox ID from ⚙️ settings!</div>';
    f.forEach(async u => {
      if (!userCache[u]) { const s = await db.collection('vox_users').doc(u).get(); userCache[u] = s.data() || {displayName: 'Unknown'}; }
      const el = $('fr_' + u); if (el) el.innerHTML = `<img class="avatar" src="${userCache[u].photoURL || DEFAULT_AV}"><span>${esc(userCache[u].displayName)}</span>`;
    });
  } else if (view.type === 'server') {
    const s = servers.find(x => x.id === view.id); if (!s) return;
    t.textContent = s.name;
    
    // 🚨 HERE IS THE PLUG BUTTON!
    b.innerHTML = s.owner === me.uid ? `<button onclick="addChannelModal()">＋</button><button title="Bot webhook" onclick="setWebhook('${s.id}')">🤖</button><button title="Import Discord Bot" onclick="importBotModal('${s.id}')">🔌</button><button class="danger" onclick="deleteServer('${s.id}')">🗑️</button>` : '';
    
    l.innerHTML = channels.map(c => `<div class="item ${channel && channel.id === c.id ? 'on' : ''}" onclick="selectChannel('${c.id}')"><span>${c.type === 'voice' ? '🔊' : '#'} ${esc(c.name)}</span></div>`).join('');
  } else if (view.type === 'group') {
    const g = groups.find(x => x.id === view.id); if (!g) return;
    t.textContent = g.name; b.innerHTML = '';
    l.innerHTML = (g.members || []).map(u => `<div class="item"><span>👤 ${esc((userCache[u] || {}).displayName || u.slice(0, 6))}</span></div>`).join('');
    (g.members || []).forEach(async u => { if (!userCache[u]) { const s = await db.collection('vox_users').doc(u).get(); userCache[u] = s.data() || {}; renderSide(); } });
  }
}

function listenMessages() {
  stop('msgs');
  let q = db.collection('vox_messages');
  if (view.type === 'server') q = q.where('serverId', '==', view.id);
  else if (view.type === 'group') q = q.where('groupId', '==', view.id);
  else return;
  const chId = channel ? channel.id : null;
  unsubs.msgs = q.onSnapshot(s => {
    let m = s.docs.map(d => ({id: d.id, ...d.data()}));
    if (view.type === 'server') m = m.filter(x => x.channel === chId);
    m.sort((a, b) => (a.timestamp?.seconds || 9e9) - (b.timestamp?.seconds || 9e9));
    const box = $('msgs');
    const tempUpload = box.querySelector('[id^="temp_upload_"]');
    if(m.length) {
        box.innerHTML = m.map(renderMsg).join('');
        if (tempUpload) box.appendChild(tempUpload);
    } else {
        if(!tempUpload) box.innerHTML = '<div class="empty">Nothing here yet. Say hi! 👋</div>';
    }
    box.scrollTop = box.scrollHeight;
    m.forEach(x => msgCache[x.id] = x); loadPreviews();
    const cur = vList[vIdx];
    vList = m.filter(x => x.mediaUrl && ['image', 'video', 'pdf'].includes(mediaKind(x))).map(x => x.id);
    vIdx = Math.max(0, vList.indexOf(cur));
  });
}
function linkify(t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function renderMsg(x) {
  let media = '';
  if (x.mediaUrl) {
    const u = esc(x.mediaUrl), k = mediaKind(x);
    if (k === 'image') media = `<img class="m" src="${u}" style="cursor:zoom-in" onclick="openViewer('${x.id}')">`;
    else if (k === 'video') media = `<div style="position:relative;display:inline-block"><video src="${u}" controls></video><button class="vexp" title="Open in viewer" onclick="openViewer('${x.id}')">⛶</button></div>`;
    else if (k === 'audio') media = `<audio src="${u}" controls></audio>`;
    else if (k === 'pdf') media = `<div class="filecard">📄 PDF <button onclick="openViewer('${x.id}')">👁 View</button><a href="${esc(dlUrl(x.mediaUrl))}" target="_blank" rel="noopener">⬇</a></div>`;
    else media = `<div class="filecard">📁 File <a href="${esc(dlUrl(x.mediaUrl))}" target="_blank" rel="noopener">⬇ Download</a></div>`;
  }
  const link = (x.text || '').match(/https?:\/\/[^\s<]+/);
  const lp = link ? `<div class="lp" data-url="${esc(link[0])}"></div>` : '';
  const mine = x.senderUid ? x.senderUid === me.uid : (x.sender === profile.displayName || x.sender === me.displayName);
  const acts = `<div class="acts"><button title="Copy" onclick="copyMsg('${x.id}')">📋 Copy</button>${mine ? `<button title="Delete" onclick="delMsg('${x.id}')">🗑️ Delete</button>` : ''}</div>`;
  const time = x.timestamp ? new Date(x.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
  return `<div class="msg"><img class="avatar" src="${esc(x.senderPhoto) || DEFAULT_AV}"><div class="body"><span class="n">${esc(x.sender)}</span><span class="t">${time}</span><div>${linkify(x.text)}</div>${lp}${media}</div>${acts}</div>`;
}
let vList = [], vIdx = 0;
function mediaKind(x) {
  const t = (x.mediaType || '').toLowerCase(), u = (x.mediaUrl || '').toLowerCase();
  if (t.startsWith('image')) return 'image';
  if (t.startsWith('video')) return 'video';
  if (t.startsWith('audio')) return 'audio';
  if (t.includes('pdf') || /\.pdf(\?|$)/.test(u)) return 'pdf';
  return 'file';
}
function dlUrl(u) { return u.includes('/upload/') ? u.replace('/upload/', '/upload/fl_attachment/') : u; }
function openViewer(id) {
  const i = vList.indexOf(id);
  if (i < 0) { vList.push(id); vIdx = vList.length - 1; } else vIdx = i;
  showViewer();
}
function showViewer() {
  const x = msgCache[vList[vIdx]]; if (!x) return;
  const k = mediaKind(x), st = $('vstage'); let el;
  st.innerHTML = '';
  if (k === 'image') { el = document.createElement('img'); el.src = x.mediaUrl; el.onclick = () => el.classList.toggle('z'); }
  else if (k === 'video') { el = document.createElement('video'); el.src = x.mediaUrl; el.controls = true; el.autoplay = true; }
  else { el = document.createElement('iframe'); el.src = x.mediaUrl; }
  el.style.margin = 'auto'; st.appendChild(el);
  $('vtitle').textContent = (x.sender || '') + (x.text ? ' - ' + x.text : '');
  $('vdl').href = dlUrl(x.mediaUrl);
  $('vprev').style.display = $('vnext').style.display = vList.length > 1 ? '' : 'none';
  $('viewer').classList.remove('hidden');
}
function closeViewer() { $('viewer').classList.add('hidden'); $('vstage').innerHTML = ''; }
function vnav(d) { vIdx = (vIdx + d + vList.length) % vList.length; showViewer(); }
document.addEventListener('keydown', e => {
  if ($('viewer').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') vnav(-1);
  else if (e.key === 'ArrowRight') vnav(1);
});
function copyMsg(id) {
  const x = msgCache[id]; if (!x) return;
  const t = x.text || x.mediaUrl || '';
  navigator.clipboard.writeText(t).then(() => toast('Copied! 📋'), () => prompt('Copy this:', t));
}
async function delMsg(id) {
  if (!confirm('Delete this message?')) return;
  try { await db.collection('vox_messages').doc(id).delete(); toast('Message deleted 🗑️'); }
  catch (e) { toast('Could not delete: ' + (e.code || e.message)); }
}
async function getPreview(url) {
  if (previewCache[url] !== undefined) return previewCache[url];
  let info = null;
  try {
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
    const j = await r.json();
    if (j.status === 'success') { const d = j.data; info = {title: d.title || '', desc: d.description || '', img: (d.image && d.image.url) || (d.logo && d.logo.url) || '', site: d.publisher || ''}; }
  } catch (e) {}
  const yt = url.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/);
  if (yt) {
    info = info || {title: 'YouTube video', desc: '', img: '', site: 'YouTube'};
    info.img = `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`;
  }
  previewCache[url] = info; return info;
}
function loadPreviews() {
  document.querySelectorAll('.lp:not([data-done])').forEach(async el => {
    el.dataset.done = 1;
    const info = await getPreview(el.dataset.url);
    if (!info || !(info.title || info.img)) return;
    el.innerHTML = `<a class="prev" href="${esc(el.dataset.url)}" target="_blank" rel="noopener">${info.img ? `<img src="${esc(info.img)}" alt="">` : ''}<div><small>${esc(info.site)}</small><b>${esc(info.title)}</b><span>${esc((info.desc || '').slice(0, 160))}</span></div></a>`;
    const box = $('msgs'); if (el.closest('.msg') === box.lastElementChild) box.scrollTop = box.scrollHeight;
  });
}
async function postMessage(extra) {
  const base = {senderUid: me.uid, sender: profile.displayName || 'Voxer', senderPhoto: profile.photoURL || '', text: '', mediaUrl: '', mediaType: '', timestamp: firebase.firestore.FieldValue.serverTimestamp()};
  if (view.type === 'server') { if (!channel) return toast('Pick a text channel first!'); base.serverId = view.id; base.channel = channel.id; }
  else if (view.type === 'group') base.groupId = view.id;
  else return;
  await db.collection('vox_messages').add({...base, ...extra});
  
  if (extra.text && BOT_API_URL) {
    fetch(BOT_API_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text: extra.text, sender: base.sender, groupId: base.groupId || null, serverId: base.serverId || null, channel: base.channel || null })
    }).catch(err => console.log("Bot API error:", err));
  }
  if (view.type === 'server' && extra.text) {
    const s = servers.find(x => x.id === view.id);
    if (s && s.webhookUrl) fetch(s.webhookUrl, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({content: `${base.sender}: ${extra.text}`})}).catch(() => {});
  }
}
async function send() {
  const v = $('text').value.trim(); if (!v) return;
  $('text').value = '';
  try { await postMessage({text: v}); } catch (e) { toast('Could not send: ' + e.message); }
}

function toggleMenu(e) { e.stopPropagation(); $('menu').classList.toggle('hidden'); }
document.addEventListener('click', () => $('menu').classList.add('hidden'));
function pick(accept) { uploadAccept = accept; const f = $('file'); f.accept = accept; $('menu').classList.add('hidden'); f.click(); }
const CLOUDINARY = {cloudName: 'x9rwrmqe', uploadPreset: 'vox_uploads'};
async function cloudUpload(file) {
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUDINARY.uploadPreset);
  let r;
  try { r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/auto/upload`, {method: 'POST', body: fd}); }
  catch (e) { throw new Error('could not reach Cloudinary'); }
  const j = await r.json();
  if (!j.secure_url) throw new Error((j.error && j.error.message) || 'upload failed');
  return j.secure_url;
}
async function catbox(file) {
  if (CLOUDINARY.cloudName && CLOUDINARY.uploadPreset) return cloudUpload(file);
  const fd = new FormData(); fd.append('reqtype', 'fileupload'); fd.append('fileToUpload', file);
  let r;
  try { r = await fetch('https://catbox.moe/user/api.php', {method: 'POST', body: fd}); }
  catch (e) { throw new Error('could not reach Catbox'); }
  const u = (await r.text()).trim(); if (!u.startsWith('http')) throw new Error(u || 'Catbox sent no link'); return u;
}
async function upload(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  sendFile(f);
}
document.addEventListener('paste', e => {
  if (!me || $('composer').classList.contains('hidden') || !$('modal').classList.contains('hidden')) return;
  const it = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!it) return;
  const f = it.getAsFile(); if (!f) return;
  e.preventDefault(); sendFile(f);
});
async function sendFile(f) {
  if (f.size > 25 * 1024 * 1024) return toast('File is too big! Max 25MB on the free plan.');
  const tempId = 'temp_upload_' + Date.now();
  const box = $('msgs');
  if (box) {
    const tempMsg = document.createElement('div');
    tempMsg.className = 'msg'; tempMsg.id = tempId;
    tempMsg.innerHTML = `<div class="avatar" style="display:flex;align-items:center;justify-content:center;background:var(--p1);border:2px solid var(--blue);"><div class="spinner"></div></div><div class="body"><span class="n">Uploading...</span><div style="color:var(--mut);font-size:13px;margin-top:4px;">Processing <b>${esc(f.name)}</b></div></div>`;
    box.appendChild(tempMsg); box.scrollTop = box.scrollHeight;
  }
  try {
    const url = await catbox(f);
    const type = f.type.startsWith('image') ? 'image' : f.type.startsWith('video') ? 'video' : f.type.startsWith('audio') ? 'audio' : 'file';
    await postMessage({mediaUrl: url, mediaType: type, text: type === 'file' ? f.name : ''});
  } catch (e) { toast('Upload failed: ' + e.message); } 
  finally { const el = document.getElementById(tempId); if (el) el.remove(); }
}

function modal(html) { $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- servers ---------- */
function createServerModal() {
  modal(`<h3>Create a server</h3><input id="svName" placeholder="Server name"><input id="svHook" placeholder="Webhook URL (optional, for bots)"><div class="row"><button onclick="closeModal()">Cancel</button><button class="pri" onclick="createServer()">Create</button></div>`);
}
async function createServer() {

  const ref = await db.collection('vox_servers').add({name, owner: me.uid, webhookUrl: $('svHook').value.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  await db.collection('vox_channels').add({serverId: ref.id, name: 'general', type: 'text', createdAt: firebase.firestore.FieldValue.serverTimestamp()});

function addChannelModal() {
  modal(`<h3>New channel</h3><input id="chName" placeholder="channel-name"><div class="row"><button id="tText" class="pri" onclick="this.dataset.s=1;this.nextElementSibling.dataset.s=0;this.classList.add('pri');this.nextElementSibling.classList.remove('pri')" data-s="1"># Text</button><button onclick="this.dataset.s=1;this.previousElementSibling.dataset.s=0;this.classList.add('pri');this.previousElementSibling.classList.remove('pri')" data-s="0">🔊 Voice</button></div><div class="row" style="margin-top:12px"><button onclick="closeModal()">Cancel</button><button class="pri" onclick="addChannel()">Create</button></div>`);
}
async function addChannel() {
  const name = $('chName').value.trim().toLowerCase().replace(/\s+/g, '-'); if (!name) return;
  const type = $('tText').dataset.s === '1' ? 'text' : 'voice';
  await db.collection('vox_channels').add({serverId: view.id, name, type, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
  closeModal();
}
async function setWebhook(id) {
  const s = servers.find(x => x.id === id);
  const url = prompt('Bot webhook URL (leave empty to turn off):', (s && s.webhookUrl) || '');
  if (url === null) return;
  try { await db.collection('vox_servers').doc(id).update({webhookUrl: url.trim()}); toast('Webhook saved 🤖'); } catch (e) { dbErr(e); }
}
async function deleteServer(id) {
  if (!confirm('Delete this server? This cannot be undone.')) return;
  try {
    toast('Deleting… 🗑️');
    const refs = [];
    (await db.collection('vox_messages').where('serverId', '==', id).get()).forEach(d => refs.push(d.ref));
    (await db.collection('vox_channels').where('serverId', '==', id).get()).forEach(d => refs.push(d.ref));
    refs.push(db.collection('vox_servers').doc(id));
    for (let i = 0; i < refs.length; i += 400) {
      const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit();
    }
    openView('home'); toast('Server deleted ✅');
  } catch (e) { toast('Delete failed: ' + e.message); }
}

/* ---------- WebRTC video calls ---------- */
const rtcCfg = {iceServers: [{urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302']}]};
let pc = null, localStream = null, callRef = null, callUnsubs = [];

async function setupPC(ref, role) {
  localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  $('localV').srcObject = localStream;
  pc = new RTCPeerConnection(rtcCfg);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remoteV').srcObject = e.streams[0]; };
  const mine = role === 'caller' ? 'callerCandidates' : 'calleeCandidates';
  const theirs = role === 'caller' ? 'calleeCandidates' : 'callerCandidates';
  pc.onicecandidate = e => { if (e.candidate) ref.collection(mine).add(e.candidate.toJSON()); };
  callUnsubs.push(ref.collection(theirs).onSnapshot(s => s.docChanges().forEach(c => { if (c.type === 'added' && pc) pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(() => {}); })));
  $('callbox').classList.remove('hidden');
}
async function startCall(uid, roomRef) {
  try {
    callRef = roomRef || db.collection('vox_calls').doc();
    await setupPC(callRef, 'caller');
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    await callRef.set({callerUid: me.uid, calleeUid: uid || null, offer: {type: offer.type, sdp: offer.sdp}});
    callUnsubs.push(callRef.onSnapshot(s => {
      const d = s.data(); if (d && d.answer && pc && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      if (!s.exists) hangup(true);
    }));
  } catch (e) { toast('Call failed: ' + e.message); hangup(true); }
}
async function joinVoice() {
  if (!channel || pc) return;
  const ref = db.collection('vox_calls').doc(view.id + '_' + channel.id);
  try {
    const snap = await ref.get(); const d = snap.data();
    if (snap.exists && d.offer && !d.answer && d.callerUid !== me.uid) await answerCall(ref, d);
    else await startCall(null, ref);
  } catch (e) { dbErr(e); }
}
function listenCalls() {
  stop('calls');
  unsubs.calls = db.collection('vox_calls').where('calleeUid', '==', me.uid).onSnapshot(s => s.docChanges().forEach(c => {
    const d = c.doc.data();
    if (c.type === 'added' && d.offer && !d.answer && !pc) {
      const who = (userCache[d.callerUid] || {}).displayName || 'A friend';
      if (confirm(`📹 ${who} is calling you! Answer?`)) answerCall(c.doc.ref, d); else c.doc.ref.delete();
    }
  }));
}
async function answerCall(ref, d) {
  try {
    callRef = ref; await setupPC(ref, 'callee');
    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    await ref.update({answer: {type: ans.type, sdp: ans.sdp}});
    callUnsubs.push(ref.onSnapshot(s => { if (!s.exists) hangup(true); }));
  } catch (e) { toast('Call failed: ' + e.message); hangup(true); }
}
async function hangup(remote) {
  callUnsubs.forEach(u => u()); callUnsubs = [];
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $('callbox').classList.add('hidden'); $('localV').srcObject = null; $('remoteV').srcObject = null;
  if (callRef && !remote) { const r = callRef; callRef = null; try { await r.delete(); } catch (e) {} }
  callRef = null;
}
