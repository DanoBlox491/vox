<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vox">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vox</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230b0d14' stroke='%2300b2ff' stroke-width='4'/%3E%3Cpath d='M30 35 L50 65 L70 35' fill='none' stroke='%2300b2ff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23ff2e93'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0b0d14;--p1:rgba(18,21,31,0.85);--p2:rgba(25,29,43,0.9);--p3:#232839;
  --blue:#00b2ff;--pink:#ff2e93;--txt:#e8ecf5;--mut:#8a93ad;
  --glass:rgba(18,21,31,0.7);--border:rgba(0,178,255,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,sans-serif;background:var(--bg);color:var(--txt);height:100vh;height:100dvh;overflow:hidden;background-image:radial-gradient(circle at 10% 10%,rgba(0,178,255,0.08) 0%,transparent 40%),radial-gradient(circle at 90% 90%,rgba(255,46,147,0.08) 0%,transparent 40%)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:var(--p3);transition:all .25s cubic-bezier(0.175,0.885,0.32,1.275)}
button:hover{filter:brightness(1.15);box-shadow:0 0 15px rgba(0,178,255,0.4);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button.pri{background:linear-gradient(135deg,var(--blue),#0077ff);color:#001a2b;box-shadow:0 0 20px rgba(0,178,255,0.5)}
button.pri:hover{box-shadow:0 0 30px rgba(0,178,255,0.8)}
button.pink{background:linear-gradient(135deg,var(--pink),#d61173);box-shadow:0 0 20px rgba(255,46,147,0.5)}
button.danger{background:linear-gradient(135deg,#ff334b,#d6334a);box-shadow:0 0 20px rgba(255,51,75,0.5)}
input,textarea{font-family:inherit;width:100%;padding:12px 16px;border-radius:12px;border:2px solid var(--p3);background:rgba(11,13,20,0.8);color:var(--txt);outline:0;margin-bottom:12px;transition:all .25s ease;backdrop-filter:blur(10px)}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 20px rgba(0,178,255,0.35);background:var(--p1)}
.hidden{display:none!important}
.logo-container{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:900;color:var(--blue);text-shadow:0 0 25px rgba(0,178,255,0.6);margin-bottom:24px;letter-spacing:1px}
.logo-svg{width:52px;height:52px;filter:drop-shadow(0 0 15px rgba(0,178,255,0.8));transition:transform .4s cubic-bezier(0.175,0.885,0.32,1.275)}
.logo-svg:hover{transform:scale(1.1) rotate(-8deg)}
#landing{display:grid;grid-template-columns:1fr 1fr;height:100vh;height:100dvh}
.side{display:flex;flex-direction:column;justify-content:center;padding:7vw;position:relative}
.side.l{background:radial-gradient(circle at 20% 20%,rgba(0,178,255,0.15),transparent 60%),var(--p1)}
.side.r{background:radial-gradient(circle at 80% 80%,rgba(255,46,147,0.15),transparent 60%),var(--bg);border-left:2px solid var(--p3)}
.side h2{font-size:38px;margin-bottom:8px;font-weight:900;letter-spacing:-0.5px}
.side p.sub{color:var(--mut);margin-bottom:26px;font-size:15px}
.side button{width:100%;margin-bottom:12px;font-size:16px}
.err{color:#ff6b81;min-height:22px;font-size:14px;font-weight:500;margin-top:4px}
#app{display:grid;grid-template-columns:76px 260px 1fr;height:100vh;height:100dvh;backdrop-filter:blur(20px)}
#rail{background:rgba(11,13,20,0.95);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.05)}
.ico{position:relative;width:52px;height:52px;border-radius:26px;background:var(--p3);display:grid;place-items:center;font-weight:900;cursor:pointer;transition:all .25s cubic-bezier(0.175,0.885,0.32,1.275);overflow:visible;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.ico:hover,.ico.on{border-radius:16px;background:var(--blue);color:#001a2b;box-shadow:0 0 20px rgba(0,178,255,0.7);transform:scale(1.05)}
.ico.grp{background:rgba(43,58,47,0.8)}
.ico.grp.on{background:#3ddc84;color:#032;box-shadow:0 0 20px rgba(61,220,132,0.7)}
#side2{background:var(--p1);display:flex;flex-direction:column;min-height:0;border-right:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(15px)}
#side2 header{padding:16px;font-weight:900;border-bottom:2px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#list{flex:1;overflow-y:auto;padding:10px}
#sideBtns{display:flex;gap:6px;flex-wrap:wrap}
#sideBtns button{padding:7px 11px;font-size:12px;border-radius:8px}
.item{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:10px;justify-content:space-between;transition:all .2s ease;position:relative;margin-bottom:3px}
.item:hover{background:rgba(0,178,255,0.08);color:var(--txt);box-shadow:0 0 12px rgba(0,178,255,0.15);transform:translateX(2px)}
.item.on{background:var(--p3);color:#fff;border-left:4px solid var(--blue);box-shadow:0 0 18px rgba(0,178,255,0.3)}
.unread-dot{width:10px;height:10px;background:var(--pink);border-radius:50%;box-shadow:0 0 12px var(--pink);display:inline-block;flex-shrink:0;animation:popIn .3s cubic-bezier(0.175,0.885,0.32,1.275)}
.ico .unread-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border:2px solid var(--bg)}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--p3);flex-shrink:0;cursor:pointer;transition:all .2s;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
.avatar:hover{box-shadow:0 0 15px rgba(0,178,255,0.8);transform:scale(1.08)}
.status-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;border:2px solid var(--p1)}
.status-dot.online{background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.status-dot.away{background:#ffb800;box-shadow:0 0 10px #ffb800}
.status-dot.offline{background:#8a93ad}
#me{padding:12px;background:rgba(25,29,43,0.7);display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;border-top:1px solid rgba(255,255,255,0.05)}
#me:hover{background:var(--p3);box-shadow:0 0 20px rgba(0,178,255,0.25)}
#me b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--p2);position:relative}
#top{padding:16px 20px;font-weight:900;border-bottom:2px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,0.4);z-index:5;background:rgba(25,29,43,0.85);backdrop-filter:blur(15px)}
#msgs{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.msg{display:flex;gap:12px;margin-bottom:16px;animation:fadeIn .3s cubic-bezier(0.175,0.885,0.32,1.275);position:relative}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg .n{font-weight:700;color:#fff;text-shadow:0 0 12px rgba(0,178,255,0.5);cursor:pointer;transition:.2s;display:inline-block}
.msg .n:hover{color:var(--blue);text-shadow:0 0 18px rgba(0,178,255,0.8)}
.msg .t{color:var(--mut);font-size:11px;margin-left:8px}
.msg img.m,.msg video{max-width:340px;max-height:280px;border-radius:14px;margin-top:8px;display:block;box-shadow:0 6px 20px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1)}
.msg a{color:var(--blue);text-shadow:0 0 8px rgba(0,178,255,0.5)}
#typing-indicator{position:absolute;bottom:70px;left:24px;font-size:12px;font-weight:600;color:var(--blue);text-shadow:0 0 10px rgba(0,178,255,0.6);font-style:italic;background:rgba(11,13,20,0.7);padding:4px 10px;border-radius:8px;backdrop-filter:blur(5px);border:1px solid rgba(0,178,255,0.2)}
#composer{padding:16px 20px;display:flex;gap:10px;position:relative;align-items:center;border-top:1px solid rgba(255,255,255,0.05);background:rgba(25,29,43,0.85);backdrop-filter:blur(15px)}
#composer input{margin:0;border-radius:14px}
#plus,#emoji-btn{width:46px;height:46px;font-size:22px;background:var(--p3);display:flex;justify-content:center;align-items:center;border-radius:14px;flex-shrink:0}
#menu,#emoji-menu{position:absolute;bottom:76px;background:rgba(18,21,31,0.95);border:2px solid var(--p3);border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,0.6),0 0 25px rgba(0,178,255,0.25);z-index:10;backdrop-filter:blur(20px)}
#menu{left:20px}
#emoji-menu{left:76px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:220px;overflow-y:auto}
#menu div{padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s}
#menu div:hover{background:var(--p3);color:var(--blue)}
#emoji-menu div{cursor:pointer;font-size:26px;padding:6px;text-align:center;border-radius:8px;transition:transform .15s}
#emoji-menu div:hover{background:var(--p3);transform:scale(1.2)}
.msg .body{min-width:0;flex:1;word-break:break-word}
.msg .acts{position:absolute;right:0;top:-10px;display:none;gap:4px;background:rgba(18,21,31,0.95);border:2px solid var(--p3);border-radius:10px;padding:3px;box-shadow:0 4px 15px rgba(0,0,0,0.5);backdrop-filter:blur(10px)}
.msg:hover .acts{display:flex}
.acts button{padding:4px 10px;font-size:12px;background:transparent;border-radius:6px}
@media(hover:none){.msg .acts{display:flex;position:static;margin-top:6px;width:max-content}}
.prev{display:block;max-width:400px;margin-top:10px;background:rgba(18,21,31,0.9);border-left:4px solid var(--blue);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--txt);transition:all .25s;box-shadow:0 4px 15px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05)}
.prev:hover{box-shadow:0 0 20px rgba(0,178,255,0.35);transform:translateY(-2px)}
.prev img{width:100%;display:block;max-height:220px;object-fit:cover}
.prev div{padding:10px 14px}
.prev b{display:block;margin-bottom:3px}
.prev span{color:var(--mut);font-size:13px;display:block}
.prev small{color:var(--blue);font-size:12px;font-weight:700}
.filecard{display:inline-flex;gap:10px;align-items:center;background:rgba(18,21,31,0.9);border:2px solid var(--p3);border-radius:12px;padding:10px 14px;margin-top:8px;transition:all .2s;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.filecard:hover{box-shadow:0 0 20px rgba(0,178,255,0.3);border-color:var(--blue)}
.filecard button{padding:5px 12px;border-radius:8px}
.filecard a{color:var(--blue);text-decoration:none;font-weight:700}
.vexp{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:8px;backdrop-filter:blur(5px)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:50;display:flex;flex-direction:column;backdrop-filter:blur(10px)}
#viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:12px;background:rgba(18,21,31,0.8);border-bottom:1px solid rgba(255,255,255,0.05)}
#vstage{flex:1;display:flex;overflow:auto;min-height:0;padding:20px;justify-content:center;align-items:center}
#vstage img{max-width:96vw;max-height:84vh;object-fit:contain;cursor:zoom-in;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.8)}
#vstage img.z{max-width:none;max-height:none;cursor:zoom-out}
#vstage video{max-width:96vw;max-height:84vh;border-radius:12px}
#vstage iframe{width:min(1000px,96vw);height:84vh;border:0;background:#fff;border-radius:12px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);font-size:28px;background:rgba(0,0,0,0.7);border-radius:50%;width:52px;height:52px;padding:0;display:grid;place-items:center;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,0.1)}
.vnav.l{left:16px}.vnav.r{right:16px}
.vnav:hover{background:var(--blue);color:#001a2b;box-shadow:0 0 20px var(--blue)}
.empty{color:var(--mut);text-align:center;margin-top:20vh;font-size:16px;font-weight:500}
.spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 15px rgba(0,178,255,0.6)}
@keyframes spin{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:grid;place-items:center;z-index:20;backdrop-filter:blur(8px)}
#modal .box{background:rgba(18,21,31,0.95);border:2px solid var(--p3);border-radius:20px;padding:26px;width:min(440px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 0 40px rgba(0,178,255,0.35);backdrop-filter:blur(20px)}
#modal h3{margin-bottom:14px;text-shadow:0 0 15px rgba(0,178,255,0.6);font-size:22px}
.row{display:flex;gap:10px}.row>*{flex:1}
#callbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:30;display:grid;place-items:center;backdrop-filter:blur(10px)}
#callbox .vids{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#callbox video{width:min(460px,44vw);background:#000;border-radius:16px;box-shadow:0 0 30px rgba(0,178,255,0.5);border:2px solid var(--p3)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(35,40,57,0.95);padding:12px 22px;border-radius:14px;z-index:40;box-shadow:0 0 25px rgba(0,178,255,0.6);border:1px solid rgba(0,178,255,0.3);font-weight:600;backdrop-filter:blur(10px);animation:fadeIn .3s}
#menuBtn{display:none;padding:8px 12px;font-size:18px;border-radius:10px}
#drawerBack{display:none}
#topTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#installBtn{padding:6px 12px;border-radius:8px;font-size:13px}
#missed-banner{background:linear-gradient(135deg,var(--pink),#ff6b8b);color:white;padding:12px 20px;text-align:center;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(255,46,147,0.5);animation:fadeIn .3s;display:none;border-bottom:2px solid rgba(255,255,255,0.2)}
#missed-banner:hover{filter:brightness(1.1)}
@media(max-width:1100px){#app{grid-template-columns:76px 220px 1fr}}
@media(max-width:760px){
  #landing{grid-template-columns:1fr;overflow-y:auto;grid-auto-rows:min-content;align-content:start}
  .side{padding:32px 24px}
  .side.r{border-left:0;border-top:2px solid var(--p3)}
  #app{grid-template-columns:64px 1fr}
  .ico{width:48px;height:48px;border-radius:24px}
  #side2{position:fixed;top:0;bottom:0;left:64px;width:min(300px,calc(100vw - 64px));z-index:40;transform:translateX(-130%);transition:transform .3s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 0 40px rgba(0,0,0,0.8)}
  #side2.open{transform:translateX(0)}
  #drawerBack.show{display:block;position:fixed;top:0;bottom:0;right:0;left:64px;background:rgba(0,0,0,0.7);z-index:35;backdrop-filter:blur(4px)}
  #menuBtn{display:inline-block}
  #top{padding:12px 16px}
  #msgs{padding:16px}
  #composer{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  #typing-indicator{bottom:74px;left:16px}
  #menu{left:14px}#emoji-menu{left:14px}
  .msg img.m,.msg video,.prev{max-width:100%}
  input,textarea{font-size:16px}
  #callbox video{width:92vw}
}
#emoji-autocomplete{position:absolute;bottom:76px;left:20px;background:rgba(18,21,31,0.95);border:2px solid var(--blue);border-radius:14px;box-shadow:0 8px 30px rgba(0,178,255,0.35);z-index:20;width:230px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;backdrop-filter:blur(20px)}
.emoji-suggestion{padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);transition:.15s}
.emoji-suggestion:hover,.emoji-suggestion.active{background:var(--p3);border-left:4px solid var(--pink);padding-left:16px}
.emoji-suggestion .emoji-icon{font-size:22px}
.emoji-suggestion .emoji-name{color:var(--txt);font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="landing">
  <div class="side l">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--blue)" stroke-width="6"/>
        <path d="M30 35 L50 65 L70 35" fill="none" stroke="var(--blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="50" r="10" fill="var(--pink)"/>
        <path d="M50 10 L50 25" stroke="var(--pink)" stroke-width="4" stroke-linecap="round"/>
        <path d="M50 75 L50 90" stroke="var(--pink)" stroke-width="4" stroke-linecap="round"/>
      </svg>
      VOX
    </div>
    <h2>Welcome back 👑</h2><p class="sub">Log in and jump into your servers.</p>
    <input id="lEmail" type="email" placeholder="Email">
    <input id="lPass" type="password" placeholder="Password">
    <button class="pri" onclick="login()">Log in</button>
    <button onclick="google()">Continue with Google</button>
    <div class="err" id="lErr"></div>
  </div>
  <div class="side r">
    <h2>New here? 🚀</h2><p class="sub">Make an account and get your own Vox ID.</p>
    <input id="sName" placeholder="Display name">
    <input id="sEmail" type="email" placeholder="Email">
    <input id="sPass" type="password" placeholder="Password (6+ characters)">
    <button class="pink" onclick="signup()">Create account</button>
    <div class="err" id="sErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="rail"></div>
  <div id="side2">
    <header><span id="sideTitle">Home</span><span id="sideBtns"></span></header>
    <div id="list"></div>
    <div id="me" onclick="openProfile()"><img class="avatar" id="meAv"><b id="meName"></b><button id="installBtn" class="pri hidden" onclick="installApp(event)">📲 Install</button><span>⚙️</span></div>
  </div>
  <div id="main">
    <div id="missed-banner" onclick="showMissedModal()">🔴 You missed <span id="missed-count">0</span> messages! Click to view.</div>
    <div id="top"><span style="display:flex;align-items:center;gap:10px;min-width:0"><button id="menuBtn" onclick="toggleDrawer()">☰</button><span id="topTitle">Pick something on the left</span></span><span id="topBtns"></span></div>
    <div id="msgs"><div class="empty">No chat open yet. Pick a server, group or friend. 🔥</div></div>
    <div id="typing-indicator" class="hidden"></div>
    <div id="composer" class="hidden">
      <button id="plus" onclick="toggleMenu(event)">+</button>
      <div id="menu" class="hidden">
        <div onclick="pick('image/*,video/*')">📷 Photo/Video</div>
        <div onclick="pick('audio/*')">🎵 Music/Audio</div>
        <div onclick="pick('*/*')">📁 Document/File</div>
      </div>
      <button id="emoji-btn" onclick="toggleEmojiMenu(event)">😀</button>
      <div id="emoji-menu" class="hidden"></div>
      <div id="emoji-autocomplete" class="hidden"></div>
      <input id="text" placeholder="Type a message..." oninput="handleInput()" onkeydown="handleKeyDown(event)">
      <button class="pri" onclick="send()">Send</button>
      <input type="file" id="file" class="hidden" onchange="upload(this)">
    </div>
  </div>
</div>

<div id="drawerBack" onclick="setDrawer(false)"></div>
<div id="viewer" class="hidden">
  <div class="vbar"><b id="vtitle"></b><span><a id="vdl" target="_blank" rel="noopener"><button>⬇ Download</button></a> <button onclick="closeViewer()">✕ Close</button></span></div>
  <div id="vstage"></div>

function makePingWav() {
  const rate = 22050, n = Math.floor(rate * 0.45);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/rate,f=t<.12?880:1320;v.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*Math.exp(-6*t)*0.6*32767,true);}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

  if(p&&p.then)p.then(done).catch(()=>{pingAudio.muted=false;audioUnlocked=false;});

}

function checkMissedMessages(){
  if(!me)return;
  const lastSeen=Number(localStorage.getItem('vox_last_seen'))||(Date.now()-86400000);
  db.collection('vox_messages').where('timestamp','>',new Date(lastSeen)).get().then(snap=>{
    missedMessages=[];
    snap.forEach(doc=>{
      const d=doc.data(); if(d.senderUid===me.uid)return;
      let type,id,name;
      if(d.groupId){const g=groups.find(x=>x.id===d.groupId);if(!g)return;type='group';id=d.groupId;name='👥 '+g.name;}
      else if(d.dmId){if(!d.dmId.includes(me.uid))return;const f=d.dmId.split('_').find(u=>u!==me.uid&&u!=='dm');if(!f)return;type='dm';id=f;name='💬 '+(friends.find(x=>x.uid===f)?.displayName||'DM');}
      else if(d.serverId){const s=servers.find(x=>x.id===d.serverId);if(!s)return;type='server';id=d.serverId;name='🏠 '+s.name+' > #'+d.channel;}
      else return;
      missedMessages.push({type,id,name,channel:d.channel,text:d.text||'Media',sender:d.sender});
    });
    if(missedMessages.length>0){$('missed-count').innerText=missedMessages.length;$('missed-banner').style.display='block';}
  }).catch(e=>console.warn("missed fetch",e));
  localStorage.setItem('vox_last_seen',Date.now().toString());
}
function showMissedModal(){
  if(!missedMessages.length)return;
  let html=`<h3>Missed Messages 🔴</h3><div style="max-height:300px;overflow-y:auto;margin-bottom:16px;">`;
  const rooms={};
  missedMessages.forEach(m=>{const k=m.type+'_'+m.id+'_'+(m.channel||'');if(!rooms[k])rooms[k]={name:m.name,type:m.type,id:m.id,channel:m.channel,count:0};rooms[k].count++;});

  html+=`</div><button onclick="closeModal(); $('missed-banner').style.display='none'; missedMessages=[];" class="pri">Clear</button>`;
  modal(html);
}

  }catch(e){MASTER_EMOJI_DICT={skull:"💀",fire:"🔥",joy:"😂",100:"💯"};}
}

function handleInput(){handleEmojiTyping();handleTypingStatus();}
function handleEmojiTyping(){
  const val=$('text').value,cursor=$('text').selectionStart;
  const m=val.slice(0,cursor).match(/:([a-zA-Z0-9_+-]+)$/);
  if(m){
    const search=m[1].toLowerCase();
    currentSuggestions=Object.keys(MASTER_EMOJI_DICT).filter(k=>k.includes(search)).slice(0,8);
    if(currentSuggestions.length){autocompleteActive=true;autocompleteIndex=0;renderEmojiAutocomplete();$('emoji-autocomplete').classList.remove('hidden');}
    else closeEmojiAutocomplete();
  }else closeEmojiAutocomplete();
}
function renderEmojiAutocomplete(){
  const box=$('emoji-autocomplete');box.innerHTML='';
  currentSuggestions.forEach((name,i)=>{
    const div=document.createElement('div');
    div.className=`emoji-suggestion ${i===autocompleteIndex?'active':''}`;
    div.innerHTML=`<span class="emoji-icon">${MASTER_EMOJI_DICT[name]}</span><span class="emoji-name">:${name}:</span>`;
    div.onclick=()=>selectEmojiSuggestion(name);
    box.appendChild(div);
  });
}
function closeEmojiAutocomplete(){autocompleteActive=false;$('emoji-autocomplete').classList.add('hidden');currentSuggestions=[];}
function selectEmojiSuggestion(name){
  const txt=$('text'),val=txt.value,cursor=txt.selectionStart;
  const before=val.slice(0,cursor),after=val.slice(cursor);
  const nb=before.replace(/:([a-zA-Z0-9_+-]+)$/,MASTER_EMOJI_DICT[name]+' ');
  txt.value=nb+after;txt.selectionStart=txt.selectionEnd=nb.length;
  closeEmojiAutocomplete();txt.focus();
}
function handleKeyDown(e){
  if(autocompleteActive){
    if(e.key==='ArrowDown'){e.preventDefault();autocompleteIndex=(autocompleteIndex+1)%currentSuggestions.length;renderEmojiAutocomplete();}
    else if(e.key==='ArrowUp'){e.preventDefault();autocompleteIndex=(autocompleteIndex-1+currentSuggestions.length)%currentSuggestions.length;renderEmojiAutocomplete();}
    else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();if(currentSuggestions[autocompleteIndex])selectEmojiSuggestion(currentSuggestions[autocompleteIndex]);}
    else if(e.key==='Escape')closeEmojiAutocomplete();
  }else if(e.key==='Enter')send();
}
function toggleMenu(e){e.stopPropagation();$('menu').classList.toggle('hidden');emojiMenu.classList.add('hidden');closeEmojiAutocomplete();}

      list.appendChild(d);
    });
    if(!s.channels||!s.channels.length){
      list.innerHTML='<div class="empty" style="margin-top:20px;font-size:13px">No channels yet.</div>';
    }
    return;
  }
  if(view.type==='group'){
    const g=groups.find(x=>x.id===view.id);
    if(!g)return;
    title.textContent='👥 '+g.name;
  }
  if(view.type==='dm'){
    title.textContent='💬 '+(userCache[view.id]?.displayName||'DM');
  }
  list.innerHTML='';
}

/* ============ VIEW NAV ============ */
function openView(type,id){
  view={type,id};
  channel=null;
  stop('msgs');stop('typing');
  $('msgs').innerHTML='';
  $('topBtns').innerHTML='';
  setDrawer(false);
  renderRail();
  if(type==='home'){
    $('topTitle').textContent='Home';
    $('composer').classList.add('hidden');
    $('typing-indicator').classList.add('hidden');
    $('msgs').innerHTML='<div class="empty">Pick a server, group or friend on the left. 🔥</div>';
    renderSide();
    return;
  }
  if(type==='server'){
    const s=servers.find(x=>x.id===view.id);
    if(!s)return;
    $('topTitle').textContent=s.name||'Server';
    renderSide();
    const defaultCh=s.channels&&s.channels[0];
    if(defaultCh)selectChannel(defaultCh.id);
    else{$('composer').classList.add('hidden');$('msgs').innerHTML='<div class="empty">No channels yet. Create one!</div>';}
    return;
  }
  if(type==='group'){
    const g=groups.find(x=>x.id===view.id);
    $('topTitle').textContent='👥 '+(g?g.name:'Group');
    $('composer').classList.remove('hidden');
    renderSide();
    listenMessages();
    listenTyping();
    return;
  }
  if(type==='dm'){
    $('topTitle').textContent='💬 '+(userCache[view.id]?.displayName||'DM');
    $('composer').classList.remove('hidden');
    renderSide();
    loadUser(view.id).then(()=>{$('topTitle').textContent='💬 '+(userCache[view.id]?.displayName||'DM');renderRail();});
    listenMessages();
    listenTyping();
    return;
  }
}
function selectChannel(chId){
  if(view.type!=='server')return;
  const s=servers.find(x=>x.id===view.id);if(!s)return;
  channel=s.channels.find(c=>c.id===chId);
  if(!channel)return;
  $('topTitle').textContent=(s.name||'Server')+' › #'+channel.name;
  $('composer').classList.remove('hidden');
  renderSide();
  listenMessages();
  listenTyping();
}

/* ============ MESSAGES ============ */
function getRoomId(){
  if(view.type==='server'&&view.id&&channel)return `server_${view.id}_${channel.id}`;
  if(view.type==='group'&&view.id)return `group_${view.id}`;
  if(view.type==='dm'&&view.id){const ids=[me.uid,view.id].sort();return `dm_${ids[0]}_${ids[1]}`;}
  return null;
}
function listenMessages(){
  stop('msgs');
  const roomId=getRoomId();if(!roomId)return;
  let query=db.collection('vox_messages').where('roomId','==',roomId).orderBy('timestamp','asc').limitToLast(100);
  unsubs.msgs=query.onSnapshot(snap=>{
    const box=$('msgs');
    box.innerHTML='';
    if(snap.empty){box.innerHTML='<div class="empty">No messages yet. Say hi! 👋</div>';return;}
    snap.forEach(doc=>{
      const m={id:doc.id,...doc.data()};
      box.appendChild(renderMsg(m));
    });
    box.scrollTop=box.scrollHeight;
    clearCurrentUnread();
  },e=>console.warn('msgs',e));
}
function renderMsg(m){
  const wrap=document.createElement('div');
  wrap.className='msg';
  const avatar=userCache[m.senderUid]?.photoURL||DEFAULT_AV;
  const name=m.sender||userCache[m.senderUid]?.displayName||'User';
  const time=m.timestamp?new Date(m.timestamp.toDate()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
  let content='';
  if(m.attachment){
    const a=m.attachment;
    if(a.type&&a.type.startsWith('image'))content=`<img class="m" src="${a.url}" onclick="openViewer('${a.url}','image')">`;
    else if(a.type&&a.type.startsWith('video'))content=`<video src="${a.url}" controls></video>`;
    else if(a.type&&a.type.startsWith('audio'))content=`<audio src="${a.url}" controls style="margin-top:8px;width:100%"></audio>`;
    else content=`<div class="filecard"><a href="${a.url}" target="_blank" rel="noopener">📁 ${esc(a.name||'File')}</a></div>`;
  }
  if(m.text)content+=`<div>${linkify(esc(m.text))}</div>`;
  wrap.innerHTML=`
    <img class="avatar" src="${avatar}" onclick="openUserProfile('${m.senderUid}')">
    <div class="body">
      <span class="n" onclick="openUserProfile('${m.senderUid}')">${esc(name)}</span><span class="t">${time}</span>
      <div class="content">${content}</div>
    </div>
    ${m.senderUid===me.uid?`<div class="acts"><button onclick="deleteMsg('${m.id}')">🗑</button></div>`:''}
  `;
  return wrap;
}
async function send(){
  const txt=$('text').value.trim();
  if(!txt)return;
  const roomId=getRoomId();if(!roomId)return;
  const payload={
    roomId,text:txt,sender:profile.displayName||me.email,senderUid:me.uid,
    timestamp:firebase.firestore.FieldValue.serverTimestamp(),
    type:view.type
  };
  if(view.type==='server'){payload.serverId=view.id;payload.channel=channel.id;}
  if(view.type==='group')payload.groupId=view.id;
  if(view.type==='dm'){const ids=[me.uid,view.id].sort();payload.dmId=`dm_${ids[0]}_${ids[1]}`;}
  $('text').value='';
  try{
    await db.collection('vox_messages').add(payload);
    if(view.type==='server'||view.type==='dm'){
      fetch(BOT_API_URL+'/discord-relay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,text:txt})}).catch(()=>{});
    }
  }catch(e){toast('Send failed: '+e.message);}
}
async function deleteMsg(id){
  if(!confirm('Delete this message?'))return;
  try{await db.collection('vox_messages').doc(id).delete();}
  catch(e){toast('Delete failed');}
}
function openUserProfile(uid){
  if(uid===me.uid){openProfile();return;}
  viewOtherProfile.currentUid=uid;
  const u=userCache[uid]||{displayName:'User',photoURL:DEFAULT_AV};
  modal(`
    <h3>Profile</h3>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div style="position:relative"><img src="${u.photoURL||DEFAULT_AV}" style="width:64px;height:64px;border-radius:50%"><span class="status-dot offline" id="profile-presence-dot" style="width:14px;height:14px"></span></div>
      <div><b style="font-size:18px">${esc(u.displayName)}</b><div style="color:var(--mut);font-size:13px" id="profile-presence-text">Loading…</div></div>
    </div>
    <button class="pri" onclick="startDM('${uid}');closeModal()">💬 Message</button>
    <button style="margin-top:8px" onclick="closeModal()">Close</button>
  `);
  watchPresence(uid);
}

/* ============ TYPING ============ */
function handleTypingStatus(){
  const roomId=getRoomId();if(!roomId)return;
  db.collection('vox_typing').doc(roomId).set({[me.uid]:profile.displayName},{merge:true}).catch(()=>{});
  if(typingTimer)clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    db.collection('vox_typing').doc(roomId).update({[me.uid]:firebase.firestore.FieldValue.delete()}).catch(()=>{});
  },2500);
}
function listenTyping(){
  if(typingUnsub){try{typingUnsub();}catch(e){}}
  const roomId=getRoomId();if(!roomId)return;
  typingUnsub=db.collection('vox_typing').doc(roomId).onSnapshot(doc=>{
    const ind=$('typing-indicator');
    if(!doc.exists){ind.classList.add('hidden');return;}
    const d=doc.data();
    const typers=Object.keys(d).filter(uid=>uid!==me.uid);
    if(typers.length){ind.textContent=`${typers.map(u=>d[u]).join(', ')} is typing…`;ind.classList.remove('hidden');}
    else ind.classList.add('hidden');
  });
}

/* ============ UPLOAD ============ */
async function upload(input){
  const file=input.files[0];if(!file)return;
  input.value='';
  if(CLOUDINARY.cloud==='YOUR_CLOUD_NAME'){toast('⚠️ Set your Cloudinary cloud + preset in the code');return;}
  const roomId=getRoomId();if(!roomId)return;
  toast('Uploading…');
  try{
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CLOUDINARY.preset);
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/auto/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(!data.secure_url)throw new Error(data.error?.message||'Upload failed');
    const payload={
      roomId,text:'',sender:profile.displayName||me.email,senderUid:me.uid,
      timestamp:firebase.firestore.FieldValue.serverTimestamp(),
      attachment:{url:data.secure_url,type:file.type,name:file.name},type:view.type
    };
    if(view.type==='server'){payload.serverId=view.id;payload.channel=channel.id;}
    if(view.type==='group')payload.groupId=view.id;
    if(view.type==='dm'){const ids=[me.uid,view.id].sort();payload.dmId=`dm_${ids[0]}_${ids[1]}`;}
    await db.collection('vox_messages').add(payload);
    toast('✅ Uploaded!');
  }catch(e){toast('Upload failed: '+e.message);}
}

function openProfile(){
  modal(`
    <h3>Your Profile ⚙️</h3>
    <div style="text-align:center;margin-bottom:14px"><img src="${profile.photoURL||DEFAULT_AV}" style="width:80px;height:80px;border-radius:50%;margin-bottom:8px"><div style="font-weight:700;font-size:18px">${esc(profile.displayName||'')}</div><div style="color:var(--mut);font-size:13px">${esc(profile.email||'')}</div></div>

async function saveProfile(){
  const name=$('pName').value.trim();if(!name){toast('Name is empty');return;}

  profile.displayName=name;
  $('meName').textContent=name;

/* ============ CREATE / JOIN ============ */
function createServerPrompt(){
  modal(`<h3>New Server 🏠</h3>
    <input id="srvName" placeholder="Server name">
    <input id="srvFirst" placeholder="First channel (default: general)">
    <button class="pri" onclick="doCreateServer()">Create</button>
    <button style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}
async function doCreateServer(){
  const name=$('srvName').value.trim();if(!name){toast('Enter a name');return;}
  const first=$('srvFirst').value.trim()||'general';
  const chId='ch_'+Math.random().toString(36).slice(2,8);
  await db.collection('vox_servers').add({
    name,owner:me.uid,members:[me.uid],
    channels:[{id:chId,name:first}],
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();toast('✅ Server created');
}
function joinServerPrompt(){
  modal(`<h3>Join Server 🔗</h3>
    <input id="joinId" placeholder="Server ID">
    <button class="pri" onclick="doJoinServer()">Join</button>
    <button style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}
async function doJoinServer(){
  const id=$('joinId').value.trim();if(!id){toast('Enter an ID');return;}
  try{
    await db.collection('vox_servers').doc(id).update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)});
    closeModal();toast('✅ Joined');
  }catch(e){toast('Join failed');}
}
function addChannelPrompt(sid){
  modal(`<h3>New Channel #</h3>
    <input id="chName" placeholder="Channel name">
    <button class="pri" onclick="doAddChannel('${sid}')">Add</button>
    <button style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}
async function doAddChannel(sid){
  const name=$('chName').value.trim();if(!name){toast('Enter name');return;}
  const chId='ch_'+Math.random().toString(36).slice(2,8);
  await db.collection('vox_servers').doc(sid).update({channels:firebase.firestore.FieldValue.arrayUnion({id:chId,name})});
  closeModal();
}
function createGroupPrompt(){
  modal(`<h3>New Group 👥</h3>
    <input id="grpName" placeholder="Group name">
    <button class="pri" onclick="doCreateGroup()">Create</button>
    <button style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}
async function doCreateGroup(){
  const name=$('grpName').value.trim();if(!name){toast('Enter name');return;}
  await db.collection('vox_groups').add({
    name,owner:me.uid,members:[me.uid],
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();toast('✅ Group created');
}
function addFriendPrompt(){
  modal(`<h3>Add Friend 👋</h3>
    <input id="frEmail" placeholder="Their email">
    <button class="pri" onclick="doAddFriend()">Add</button>
    <button style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}
async function doAddFriend(){
  const email=$('frEmail').value.trim().toLowerCase();if(!email){toast('Enter email');return;}
  try{
    const q=await db.collection('vox_users').where('email','==',email).limit(1).get();
    if(q.empty){toast('User not found');return;}
    const found=q.docs[0];
    if(found.id===me.uid){toast("That's you!");return;}
    const u=found.data();
    const newF={uid:found.id,displayName:u.displayName||email};
    const existing=friends.find(f=>f.uid===found.id);
    if(existing){toast('Already friends');return;}
    await db.collection('vox_friends').doc(me.uid).set({list:firebase.firestore.FieldValue.arrayUnion(newF)},{merge:true});
    await db.collection('vox_friends').doc(found.id).set({list:firebase.firestore.FieldValue.arrayUnion({uid:me.uid,displayName:profile.displayName})},{merge:true});
    closeModal();toast('✅ Friend added');
  }catch(e){toast('Failed: '+e.message);}
}
function startDM(uid){openView('dm',uid);}

/* ============ WEBRTC (simple peer) ============ */
async function startCall(){
  toast('Starting call…');
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
    $('localV').srcObject=localStream;
    $('callbox').classList.remove('hidden');
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    pc.ontrack=e=>{$('remoteV').srcObject=e.streams[0];};
    toast('Call ready — invite via DM link');
  }catch(e){toast('Camera error: '+e.message);}
}
function hangup(){
  if(pc){try{pc.close();}catch(e){}pc=null;}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  if(screenTrack){screenTrack.stop();screenTrack=null;}
  $('callbox').classList.add('hidden');
  if(callUnsub){try{callUnsub();}catch(e){}callUnsub=null;}
}
async function shareScreen(){
  try{
    const s=await navigator.mediaDevices.getDisplayMedia({video:true});
    screenTrack=s.getVideoTracks()[0];
    const sender=pc.getSenders().find(x=>x.track&&x.track.kind==='video');
    if(sender)sender.replaceTrack(screenTrack);
    $('localV').srcObject=s;
    screenTrack.onended=()=>{$('localV').srcObject=localStream;};
  }catch(e){toast('Screen share failed');}
}
