name: Release VOX Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: |
          node --check main.js
          node --check preload.js
          node --check settings.js
      - name: Build and publish Windows installer and portable app
        run: npm run dist:all -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
