name: VOX Mobile Checks

on:
  push:
    branches: [main, "feature/vox-mobile-tablet"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Expo validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check React Native app
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public
