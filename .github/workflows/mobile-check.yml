name: VOX Mobile Checks

on:
  push:
    branches: [main, "feature/vox-mobile-tablet"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Expo validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check React Native app
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Validate Expo configuration
        run: npx expo config --type public

  build-android-apk:
    name: Build installable Android APK
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Configure VOX Firebase client
        run: cp .env.example .env

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload VOX Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vox-mobile-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
