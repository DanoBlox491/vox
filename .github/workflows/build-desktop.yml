name: Build VOX Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: |
          node --check main.js
          node --check preload.js
          node --check settings.js
      - name: Build Windows installer and portable executable
        run: npm run dist:all
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: VOX-Windows-Builds
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
